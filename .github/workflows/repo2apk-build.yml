name: Repo2APK Android Build

run-name: "Repo2APK [${{ inputs.build_id }}] ${{ inputs.build_mode }} (${{ inputs.framework }})"

on:
  workflow_dispatch:
    inputs:
      build_id:
        description: "Repo2APK unique build correlation ID"
        required: true
        type: string
      commit_sha:
        description: "Target Git commit SHA to verify"
        required: true
        type: string
      project_dir:
        description: "Project directory relative to repository root"
        required: false
        default: "."
        type: string
      framework:
        description: "Detected Android framework (native_android | flutter | react_native | expo_bare)"
        required: true
        type: string
      build_mode:
        description: "Build mode (debug | release)"
        required: true
        default: "debug"
        type: string
      application_module:
        description: "Gradle application module"
        required: false
        default: "app"
        type: string
      build_variant:
        description: "Gradle variant / flavor name"
        required: false
        default: "debug"
        type: string
      abi_mode:
        description: "APK ABI mode (universal | split)"
        required: false
        default: "universal"
        type: string
      build_name:
        description: "Optional versionName override"
        required: false
        default: ""
        type: string
      build_number:
        description: "Optional versionCode override"
        required: false
        default: ""
        type: string
      java_version:
        description: "Required JDK major version"
        required: false
        default: "17"
        type: string
      flutter_version:
        description: "Flutter SDK version when applicable"
        required: false
        default: "stable"
        type: string
      compile_sdk:
        description: "Detected Android compileSdk API level"
        required: false
        default: ""
        type: string
      use_repo2apk_secrets:
        description: "Whether encrypted Repo2APK keystore secrets are attached"
        required: false
        default: "false"
        type: string

permissions:
  contents: read

jobs:
  build_apk:
    name: Compile Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: "[Stage 1] Repository verification"
        shell: bash
        run: |
          set -euo pipefail
          echo "REPO2APK_BUILD_ID=${{ inputs.build_id }}"
          echo "Framework: ${{ inputs.framework }} | Mode: ${{ inputs.build_mode }}"
          if [[ ! "${{ inputs.application_module }}" =~ ^[A-Za-z0-9._:-]+$ ]]; then
            echo "Invalid application_module input" >&2
            exit 1
          fi
          if [[ ! "${{ inputs.build_variant }}" =~ ^[A-Za-z0-9._-]+$ ]]; then
            echo "Invalid build_variant input" >&2
            exit 1
          fi

      - name: "[Stage 2] Source code checkout"
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: "[Stage 2] Verify target commit SHA"
        shell: bash
        run: |
          set -euo pipefail
          CURRENT_SHA="$(git rev-parse HEAD)"
          echo "Checked out commit: $CURRENT_SHA"
          if [[ -n "${{ inputs.commit_sha }}" && "$CURRENT_SHA" != "${{ inputs.commit_sha }}" ]]; then
            git fetch --depth=50 origin "${{ inputs.commit_sha }}" || true
            git checkout "${{ inputs.commit_sha }}"
          fi

      - name: "[Stage 3] Setup Java JDK"
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: ${{ inputs.java_version }}

      - name: "[Stage 3] Setup Android SDK"
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          if [[ ! -d "$SDK_ROOT" ]]; then
            SDK_ROOT="$HOME/Android/Sdk"
            mkdir -p "$SDK_ROOT"
          elif [[ ! -O "$SDK_ROOT" || ! -w "$SDK_ROOT" ]]; then
            if command -v sudo >/dev/null 2>&1 && sudo -n true 2>/dev/null; then
              sudo -n chown -R "$(id -un):$(id -gn)" "$SDK_ROOT"
              chmod -R u+rwX "$SDK_ROOT"
            fi
            if [[ ! -w "$SDK_ROOT" ]]; then
              WRITABLE_SDK="$HOME/Android/Sdk"
              mkdir -p "$WRITABLE_SDK/licenses"
              for sub in "$SDK_ROOT"/*; do
                [[ -e "$sub" ]] || continue
                base="$(basename "$sub")"
                if [[ "$base" == "licenses" || "$base" == ".temp" ]]; then
                  continue
                fi
                ln -sfn "$sub" "$WRITABLE_SDK/$base"
              done
              if [[ -d "$SDK_ROOT/licenses" ]]; then
                cp -rn "$SDK_ROOT/licenses/." "$WRITABLE_SDK/licenses/" 2>/dev/null || true
              fi
              SDK_ROOT="$WRITABLE_SDK"
            fi
          fi
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"

          SDKMANAGER="$(find -L "$SDK_ROOT/cmdline-tools" -name sdkmanager \( -type f -o -type l \) 2>/dev/null | sort -V | tail -n 1 || true)"
          if [[ -z "$SDKMANAGER" ]]; then
            echo "Downloading Android command-line tools..."
            mkdir -p "$SDK_ROOT/cmdline-tools"
            curl -fsSL "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip" -o "$RUNNER_TEMP/cmdline-tools.zip"
            unzip -q "$RUNNER_TEMP/cmdline-tools.zip" -d "$RUNNER_TEMP/cmdline-extract"
            mv "$RUNNER_TEMP/cmdline-extract/cmdline-tools" "$SDK_ROOT/cmdline-tools/latest"
            SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          fi
          if [[ ! -x "$SDKMANAGER" ]]; then
            chmod +x "$SDKMANAGER"
          fi
          echo "Using sdkmanager: $SDKMANAGER"

          mkdir -p "$SDK_ROOT/licenses"
          printf '\n24333f8a63b6825ea9c5514f83c2829b004d1fee\n8933bad161af4178b1185d1a37fbf41ea5269c55\nd56f5187479451eabf01fb78af6dfcb131a6481e\n' > "$SDK_ROOT/licenses/android-sdk-license"
          printf '\n84831b9409646a918e30573bab4c9c91346d8abd\n' > "$SDK_ROOT/licenses/android-sdk-preview-license"
          (set +o pipefail; yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null 2>&1 || true)

          if [[ ! -d "$SDK_ROOT/platform-tools" ]]; then
            echo "Installing platform-tools..."
            (set +o pipefail; yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" "platform-tools")
          fi

          COMPILE_SDK="${{ inputs.compile_sdk }}"
          COMPILE_MAJOR="${COMPILE_SDK%%.*}"
          if [[ "$COMPILE_MAJOR" =~ ^[0-9]+$ && ! -d "$SDK_ROOT/platforms/android-$COMPILE_MAJOR" ]]; then
            echo "Installing Android SDK platform android-$COMPILE_MAJOR..."
            (set +o pipefail; yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" "platforms;android-$COMPILE_MAJOR" || true)
          fi
          if [[ -n "$COMPILE_SDK" && "$COMPILE_SDK" != "$COMPILE_MAJOR" ]]; then
            (set +o pipefail; yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" "platforms;android-$COMPILE_SDK" || true)
          fi

          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "Android SDK ready at $SDK_ROOT"

      - name: "[Stage 3] Setup Flutter SDK"
        if: inputs.framework == 'flutter'
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ inputs.flutter_version }}
          channel: "stable"
          cache: true

      - name: "[Stage 3] Setup Node.js"
        if: inputs.framework == 'react_native' || inputs.framework == 'expo_bare'
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: "[Stage 4] Dependency installation"
        shell: bash
        run: |
          set -euo pipefail
          PROJ_DIR="${{ inputs.project_dir }}"
          cd "$PROJ_DIR"
          if [[ "${{ inputs.framework }}" == "flutter" ]]; then
            flutter pub get
          elif [[ "${{ inputs.framework }}" == "react_native" || "${{ inputs.framework }}" == "expo_bare" ]]; then
            if [[ -f "yarn.lock" ]]; then
              yarn install --frozen-lockfile || yarn install
            elif [[ -f "pnpm-lock.yaml" ]]; then
              corepack enable && pnpm install --frozen-lockfile
            elif [[ -f "package-lock.json" ]]; then
              npm ci || npm install
            else
              npm install
            fi
          else
            echo "Gradle dependencies will resolve during project configuration."
          fi

      - name: "[Stage 5] Android project configuration"
        shell: bash
        env:
          REPO2APK_KEYSTORE_BASE64: ${{ secrets.REPO2APK_KEYSTORE_BASE64 }}
          REPO2APK_STORE_PASSWORD: ${{ secrets.REPO2APK_STORE_PASSWORD }}
          REPO2APK_KEY_ALIAS: ${{ secrets.REPO2APK_KEY_ALIAS }}
          REPO2APK_KEY_PASSWORD: ${{ secrets.REPO2APK_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          PROJ_DIR="${{ inputs.project_dir }}"
          cd "$PROJ_DIR"

          resolve_gradle_dir() {
            local dir="$1"
            local env_var="$2"
            pushd "$dir" >/dev/null

            if [[ ! -f "local.properties" && -n "${ANDROID_HOME:-}" ]]; then
              printf 'sdk.dir=%s\n' "$ANDROID_HOME" > local.properties
              echo "Configured sdk.dir in $dir/local.properties"
            fi

            if [[ -f "./gradlew" ]]; then
              chmod +x ./gradlew
              echo "$env_var=./gradlew" >> "$GITHUB_ENV"
            elif [[ -f "gradle/wrapper/gradle-wrapper.properties" ]]; then
              local dist_url
              dist_url="$(grep -E '^distributionUrl=' gradle/wrapper/gradle-wrapper.properties | head -n 1 | cut -d= -f2- | sed 's/\\:/:/g' | tr -d '\r')"
              local g_ver
              g_ver="$(printf '%s' "$dist_url" | sed -n 's/.*gradle-\([0-9A-Za-z._-]*\)-\(bin\|all\)\.zip.*/\1/p')"
              if [[ -n "$dist_url" ]]; then
                local g_cache="$RUNNER_TEMP/repo2apk-gradle"
                mkdir -p "$g_cache"
                echo "Downloading Gradle ${g_ver:-wrapper} from $dist_url..."
                if ! curl -fsSL "$dist_url" -o "$g_cache/gradle.zip"; then
                  local fallback_url="https://services.gradle.org/distributions/gradle-${g_ver}-bin.zip"
                  curl -fsSL "$fallback_url" -o "$g_cache/gradle.zip"
                fi
                unzip -q -o "$g_cache/gradle.zip" -d "$g_cache"
                local g_bin
                g_bin="$(find "$g_cache" -maxdepth 4 -path '*/bin/gradle' -type f | head -n 1 || true)"
                if [[ -z "$g_bin" ]]; then
                  echo "Failed to extract Gradle executable from $dist_url" >&2
                  exit 1
                fi
                if [[ ! -x "$g_bin" ]]; then
                  chmod +x "$g_bin"
                fi
                echo "$env_var=$g_bin" >> "$GITHUB_ENV"
                echo "Resolved Gradle executable: $g_bin"
              elif command -v gradle >/dev/null 2>&1; then
                echo "WARNING: ./gradlew not found; using system gradle"
                echo "$env_var=gradle" >> "$GITHUB_ENV"
              else
                echo "Neither ./gradlew nor Gradle distribution found in $dir" >&2
                exit 1
              fi
            elif command -v gradle >/dev/null 2>&1; then
              echo "WARNING: ./gradlew not found; using system gradle"
              echo "$env_var=gradle" >> "$GITHUB_ENV"
            else
              echo "Neither ./gradlew nor system gradle found in $dir" >&2
              exit 1
            fi

            if [[ "${{ inputs.build_mode }}" == "debug" ]]; then
              mkdir -p "$HOME/.android"
              if [[ ! -f "$HOME/.android/debug.keystore" ]]; then
                keytool -genkeypair -noprompt -v \
                  -keystore "$HOME/.android/debug.keystore" \
                  -alias androiddebugkey \
                  -keyalg RSA -keysize 2048 -validity 10000 \
                  -storepass android -keypass android \
                  -dname "CN=Android Debug,O=Android,C=US" >/dev/null 2>&1 || true
              fi
              if grep -Rqs 'debug\.keystore' build.gradle* */build.gradle* 2>/dev/null; then
                if [[ ! -f "debug.keystore" ]]; then
                  echo "Generating debug.keystore referenced by Gradle config..."
                  keytool -genkeypair -noprompt \
                    -keystore "debug.keystore" \
                    -alias androiddebugkey \
                    -keyalg RSA -keysize 2048 -validity 10000 \
                    -storepass android -keypass android \
                    -dname "CN=Android Debug,O=Android,C=US"
                fi
                if [[ -d "app" && ! -f "app/debug.keystore" ]] && grep -Rqs 'debug\.keystore' app/build.gradle* 2>/dev/null; then
                  cp "debug.keystore" "app/debug.keystore"
                fi
              fi
            fi

            popd >/dev/null
          }

          if [[ ! -f ".env" && -f ".env.example" ]]; then
            cp ".env.example" ".env"
          fi

          if [[ "${{ inputs.framework }}" == "react_native" || "${{ inputs.framework }}" == "expo_bare" || "${{ inputs.framework }}" == "flutter" ]]; then
            if [[ -d "android" ]]; then
              resolve_gradle_dir "android" "ANDROID_GRADLE_CMD"
            fi
          else
            resolve_gradle_dir "." "GRADLE_CMD"
          fi

          mkdir -p "$RUNNER_TEMP/repo2apk-signing"
          if [[ "${{ inputs.use_repo2apk_secrets }}" == "true" && -n "${REPO2APK_KEYSTORE_BASE64:-}" ]]; then
            echo "::add-mask::$REPO2APK_STORE_PASSWORD"
            echo "::add-mask::$REPO2APK_KEY_PASSWORD"
            echo "::add-mask::$REPO2APK_KEY_ALIAS"
            KEYSTORE_FILE="$RUNNER_TEMP/repo2apk-signing/release.keystore"
            printf '%s' "$REPO2APK_KEYSTORE_BASE64" | base64 -d > "$KEYSTORE_FILE"
            echo "HAS_KEYSTORE=true" >> "$GITHUB_ENV"
            echo "KEYSTORE_PATH=$KEYSTORE_FILE" >> "$GITHUB_ENV"
            echo "STORE_PASSWORD=$REPO2APK_STORE_PASSWORD" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=$REPO2APK_KEY_PASSWORD" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=$REPO2APK_KEY_ALIAS" >> "$GITHUB_ENV"
          else
            echo "HAS_KEYSTORE=false" >> "$GITHUB_ENV"
          fi

      - name: "[Stage 6] APK compilation"
        shell: bash
        run: |
          set -euo pipefail
          PROJ_DIR="${{ inputs.project_dir }}"
          cd "$PROJ_DIR"

          VARIANT="${{ inputs.build_variant }}"
          CAP_VARIANT="$(tr '[:lower:]' '[:upper:]' <<< "${VARIANT:0:1}")${VARIANT:1}"
          MOD="${{ inputs.application_module }}"
          MOD_CLEAN="${MOD#:}"
          if [[ "$MOD_CLEAN" == "root" || -z "$MOD_CLEAN" ]]; then
            TASK="assemble${CAP_VARIANT}"
          else
            TASK=":${MOD_CLEAN}:assemble${CAP_VARIANT}"
          fi

          if [[ "${{ inputs.framework }}" == "flutter" ]]; then
            CMD=(flutter build apk "--${{ inputs.build_mode }}")
            if [[ "${{ inputs.abi_mode }}" == "split" ]]; then
              CMD+=(--split-per-abi)
            fi
            if [[ -n "${{ inputs.build_name }}" ]]; then
              CMD+=("--build-name=${{ inputs.build_name }}")
            fi
            if [[ -n "${{ inputs.build_number }}" ]]; then
              CMD+=("--build-number=${{ inputs.build_number }}")
            fi
            echo "Executing: ${CMD[*]}"
            "${CMD[@]}"
          elif [[ "${{ inputs.framework }}" == "react_native" || "${{ inputs.framework }}" == "expo_bare" ]]; then
            cd android
            GRADLE_BIN="${ANDROID_GRADLE_CMD:-./gradlew}"
            echo "Executing: $GRADLE_BIN $TASK --no-daemon --console=plain --stacktrace"
            "$GRADLE_BIN" "$TASK" --no-daemon --console=plain --stacktrace
          else
            GRADLE_BIN="${GRADLE_CMD:-./gradlew}"
            echo "Executing: $GRADLE_BIN $TASK --no-daemon --console=plain --stacktrace"
            "$GRADLE_BIN" "$TASK" --no-daemon --console=plain --stacktrace
          fi

      - name: "[Stage 7] APK validation & metadata"
        shell: bash
        env:
          REPO2APK_STORE_PASSWORD: ${{ secrets.REPO2APK_STORE_PASSWORD }}
          REPO2APK_KEY_ALIAS: ${{ secrets.REPO2APK_KEY_ALIAS }}
          REPO2APK_KEY_PASSWORD: ${{ secrets.REPO2APK_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          PROJ_DIR="${{ inputs.project_dir }}"
          cd "$PROJ_DIR"
          OUT_DIR="$RUNNER_TEMP/repo2apk-output"
          mkdir -p "$OUT_DIR"

          APK_PATH="$(find . -type f -path '*/outputs/apk/*' -name '*.apk' ! -name '*androidTest*' ! -name '*-unaligned*' | grep -E 'universal|arm64-v8a' | head -n 1 || true)"
          if [[ -z "$APK_PATH" ]]; then
            APK_PATH="$(find . -type f -path '*/outputs/apk/*' -name '*.apk' ! -name '*androidTest*' ! -name '*-unaligned*' | head -n 1 || true)"
          fi
          if [[ -z "$APK_PATH" ]]; then
            APK_PATH="$(find . -type f -name '*.apk' ! -path '*/intermediates/*' ! -name '*androidTest*' ! -name '*-unaligned*' | head -n 1 || true)"
          fi
          if [[ -z "$APK_PATH" || ! -f "$APK_PATH" ]]; then
            echo "No valid APK artifact found after compilation." >&2
            exit 1
          fi

          APK_FILE="$(basename "$APK_PATH")"
          TARGET_APK="$OUT_DIR/$APK_FILE"
          cp "$APK_PATH" "$TARGET_APK"

          APKSIGNER="$(find "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools" -name apksigner 2>/dev/null | sort -V | tail -n 1 || true)"
          AAPT2="$(find "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools" -name aapt2 2>/dev/null | sort -V | tail -n 1 || true)"

          SIGNING_STATUS="unsigned"
          IS_SIGNED="false"
          if [[ "${{ inputs.build_mode }}" == "debug" ]]; then
            SIGNING_STATUS="debug_signed"
            IS_SIGNED="true"
          elif [[ "${HAS_KEYSTORE:-false}" == "true" && -n "$APKSIGNER" && -f "$RUNNER_TEMP/repo2apk-signing/release.keystore" ]]; then
            "$APKSIGNER" sign \
              --ks "$RUNNER_TEMP/repo2apk-signing/release.keystore" \
              --ks-key-alias "$REPO2APK_KEY_ALIAS" \
              --ks-pass "pass:$REPO2APK_STORE_PASSWORD" \
              --key-pass "pass:$REPO2APK_KEY_PASSWORD" \
              "$TARGET_APK"
            SIGNING_STATUS="signed"
            IS_SIGNED="true"
          elif [[ -n "$APKSIGNER" ]] && "$APKSIGNER" verify "$TARGET_APK" >/dev/null 2>&1; then
            SIGNING_STATUS="signed"
            IS_SIGNED="true"
          fi

          # Validate ZIP & AndroidManifest.xml structure
          unzip -l "$TARGET_APK" | grep -q "AndroidManifest.xml"
          SHA256="$(sha256sum "$TARGET_APK" | awk '{print $1}')"

          PKG_ID=""
          APP_NAME=""
          V_NAME=""
          V_CODE=""
          if [[ -n "$AAPT2" ]]; then
            BADGING="$("$AAPT2" dump badging "$TARGET_APK" 2>/dev/null || true)"
            PKG_ID="$(printf '%s\n' "$BADGING" | sed -n "s/.*package: name='\([^']*\)'.*/\1/p" | head -n 1)"
            V_CODE="$(printf '%s\n' "$BADGING" | sed -n "s/.*versionCode='\([^']*\)'.*/\1/p" | head -n 1)"
            V_NAME="$(printf '%s\n' "$BADGING" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p" | head -n 1)"
            APP_NAME="$(printf '%s\n' "$BADGING" | sed -n "s/.*application-label:'\([^']*\)'.*/\1/p" | head -n 1)"
          fi

          jq -n \
            --arg fileName "$APK_FILE" \
            --arg appName "$APP_NAME" \
            --arg packageId "$PKG_ID" \
            --arg versionName "$V_NAME" \
            --arg versionCode "$V_CODE" \
            --arg sha256 "$SHA256" \
            --argjson isSigned "$IS_SIGNED" \
            --arg signingStatus "$SIGNING_STATUS" \
            --arg abi "${{ inputs.abi_mode }}" \
            '{fileName: $fileName, appName: $appName, packageId: $packageId, versionName: $versionName, versionCode: $versionCode, sha256: $sha256, isSigned: $isSigned, signingStatus: $signingStatus, abi: $abi}' > "$OUT_DIR/repo2apk-metadata.json"

          echo "Validated APK: $APK_FILE (SHA-256: $SHA256, signing: $SIGNING_STATUS)"

      - name: "[Stage 7] Upload APK artifact"
        uses: actions/upload-artifact@v4
        with:
          name: repo2apk-${{ inputs.build_id }}
          path: ${{ runner.temp }}/repo2apk-output/*
          retention-days: 1
          if-no-files-found: error

      - name: Cleanup ephemeral signing workspace
        if: always()
        shell: bash
        run: rm -rf "$RUNNER_TEMP/repo2apk-signing"
