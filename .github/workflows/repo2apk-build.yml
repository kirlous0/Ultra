name: Repo2APK Android Build

run-name: "Repo2APK [${{ inputs.build_id }}] ${{ inputs.build_mode }} (${{ inputs.framework }})"

on:
  workflow_dispatch:
    inputs:
      build_id:
        description: "Repo2APK unique build correlation ID"
        required: true
        type: string
      commit_sha:
        description: "Target Git commit SHA to verify"
        required: true
        type: string
      project_dir:
        description: "Project directory relative to repository root"
        required: false
        default: "."
        type: string
      framework:
        description: "Detected Android framework (native_android | flutter | react_native | expo_bare)"
        required: true
        type: string
      build_mode:
        description: "Build mode (debug | release)"
        required: true
        default: "debug"
        type: string
      application_module:
        description: "Gradle application module"
        required: false
        default: "app"
        type: string
      build_variant:
        description: "Gradle variant / flavor name"
        required: false
        default: "debug"
        type: string
      abi_mode:
        description: "APK ABI mode (universal | split)"
        required: false
        default: "universal"
        type: string
      build_name:
        description: "Optional versionName override"
        required: false
        default: ""
        type: string
      build_number:
        description: "Optional versionCode override"
        required: false
        default: ""
        type: string
      java_version:
        description: "Required JDK major version"
        required: false
        default: "17"
        type: string
      flutter_version:
        description: "Flutter SDK version when applicable"
        required: false
        default: "stable"
        type: string
      use_repo2apk_secrets:
        description: "Whether encrypted Repo2APK keystore secrets are attached"
        required: false
        default: "false"
        type: string

permissions:
  contents: read

jobs:
  build_apk:
    name: Compile Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: "[Stage 1] Repository verification"
        shell: bash
        run: |
          set -euo pipefail
          echo "REPO2APK_BUILD_ID=${{ inputs.build_id }}"
          echo "Framework: ${{ inputs.framework }} | Mode: ${{ inputs.build_mode }}"
          if [[ ! "${{ inputs.application_module }}" =~ ^[A-Za-z0-9._:-]+$ ]]; then
            echo "Invalid application_module input" >&2
            exit 1
          fi
          if [[ ! "${{ inputs.build_variant }}" =~ ^[A-Za-z0-9._-]+$ ]]; then
            echo "Invalid build_variant input" >&2
            exit 1
          fi

      - name: "[Stage 2] Source code checkout"
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: "[Stage 2] Verify target commit SHA"
        shell: bash
        run: |
          set -euo pipefail
          CURRENT_SHA="$(git rev-parse HEAD)"
          echo "Checked out commit: $CURRENT_SHA"
          if [[ -n "${{ inputs.commit_sha }}" && "$CURRENT_SHA" != "${{ inputs.commit_sha }}" ]]; then
            git fetch --depth=50 origin "${{ inputs.commit_sha }}" || true
            git checkout "${{ inputs.commit_sha }}"
          fi

      - name: "[Stage 3] Setup Java JDK"
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: ${{ inputs.java_version }}

      - name: "[Stage 3] Setup Android SDK"
        uses: android-actions/setup-android@v3

      - name: "[Stage 3] Setup Flutter SDK"
        if: inputs.framework == 'flutter'
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ inputs.flutter_version }}
          channel: "stable"
          cache: true

      - name: "[Stage 3] Setup Node.js"
        if: inputs.framework == 'react_native' || inputs.framework == 'expo_bare'
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: "[Stage 4] Dependency installation"
        shell: bash
        run: |
          set -euo pipefail
          PROJ_DIR="${{ inputs.project_dir }}"
          cd "$PROJ_DIR"
          if [[ "${{ inputs.framework }}" == "flutter" ]]; then
            flutter pub get
          elif [[ "${{ inputs.framework }}" == "react_native" || "${{ inputs.framework }}" == "expo_bare" ]]; then
            if [[ -f "yarn.lock" ]]; then
              yarn install --frozen-lockfile || yarn install
            elif [[ -f "pnpm-lock.yaml" ]]; then
              corepack enable && pnpm install --frozen-lockfile
            elif [[ -f "package-lock.json" ]]; then
              npm ci || npm install
            else
              npm install
            fi
          else
            echo "Gradle dependencies will resolve during wrapper verification."
          fi

      - name: "[Stage 5] Android project configuration"
        shell: bash
        env:
          REPO2APK_KEYSTORE_BASE64: ${{ secrets.REPO2APK_KEYSTORE_BASE64 }}
          REPO2APK_STORE_PASSWORD: ${{ secrets.REPO2APK_STORE_PASSWORD }}
          REPO2APK_KEY_ALIAS: ${{ secrets.REPO2APK_KEY_ALIAS }}
          REPO2APK_KEY_PASSWORD: ${{ secrets.REPO2APK_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          PROJ_DIR="${{ inputs.project_dir }}"
          cd "$PROJ_DIR"

          if [[ "${{ inputs.framework }}" == "react_native" || "${{ inputs.framework }}" == "expo_bare" || "${{ inputs.framework }}" == "flutter" ]]; then
            if [[ -f "android/gradlew" ]]; then
              chmod +x android/gradlew
            fi
          else
            if [[ -f "./gradlew" ]]; then
              chmod +x ./gradlew
              echo "GRADLE_CMD=./gradlew" >> "$GITHUB_ENV"
            elif command -v gradle >/dev/null 2>&1; then
              echo "WARNING: ./gradlew not found in $PROJ_DIR; falling back to system gradle"
              gradle wrapper --no-daemon || true
              if [[ -f "./gradlew" ]]; then
                chmod +x ./gradlew
                echo "GRADLE_CMD=./gradlew" >> "$GITHUB_ENV"
              else
                echo "GRADLE_CMD=gradle" >> "$GITHUB_ENV"
              fi
            else
              echo "Neither ./gradlew nor system gradle found in $PROJ_DIR" >&2
              exit 1
            fi
          fi

          mkdir -p "$RUNNER_TEMP/repo2apk-signing"
          if [[ "${{ inputs.use_repo2apk_secrets }}" == "true" && -n "${REPO2APK_KEYSTORE_BASE64:-}" ]]; then
            echo "::add-mask::$REPO2APK_STORE_PASSWORD"
            echo "::add-mask::$REPO2APK_KEY_PASSWORD"
            printf '%s' "$REPO2APK_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/repo2apk-signing/release.keystore"
            echo "HAS_KEYSTORE=true" >> "$GITHUB_ENV"
          else
            echo "HAS_KEYSTORE=false" >> "$GITHUB_ENV"
          fi

      - name: "[Stage 6] APK compilation"
        shell: bash
        run: |
          set -euo pipefail
          PROJ_DIR="${{ inputs.project_dir }}"
          cd "$PROJ_DIR"

          VARIANT="${{ inputs.build_variant }}"
          CAP_VARIANT="$(tr '[:lower:]' '[:upper:]' <<< "${VARIANT:0:1}")${VARIANT:1}"
          MOD="${{ inputs.application_module }}"
          MOD_CLEAN="${MOD#:}"
          if [[ "$MOD_CLEAN" == "root" || -z "$MOD_CLEAN" ]]; then
            TASK="assemble${CAP_VARIANT}"
          else
            TASK=":${MOD_CLEAN}:assemble${CAP_VARIANT}"
          fi

          if [[ "${{ inputs.framework }}" == "flutter" ]]; then
            CMD=(flutter build apk "--${{ inputs.build_mode }}")
            if [[ "${{ inputs.abi_mode }}" == "split" ]]; then
              CMD+=(--split-per-abi)
            fi
            if [[ -n "${{ inputs.build_name }}" ]]; then
              CMD+=("--build-name=${{ inputs.build_name }}")
            fi
            if [[ -n "${{ inputs.build_number }}" ]]; then
              CMD+=("--build-number=${{ inputs.build_number }}")
            fi
            echo "Executing: ${CMD[*]}"
            "${CMD[@]}"
          elif [[ "${{ inputs.framework }}" == "react_native" || "${{ inputs.framework }}" == "expo_bare" ]]; then
            cd android
            echo "Executing: ./gradlew $TASK --no-daemon"
            ./gradlew "$TASK" --no-daemon
          else
            GRADLE_BIN="${GRADLE_CMD:-./gradlew}"
            echo "Executing: $GRADLE_BIN $TASK --no-daemon"
            "$GRADLE_BIN" "$TASK" --no-daemon
          fi

      - name: "[Stage 7] APK validation & metadata"
        shell: bash
        env:
          REPO2APK_STORE_PASSWORD: ${{ secrets.REPO2APK_STORE_PASSWORD }}
          REPO2APK_KEY_ALIAS: ${{ secrets.REPO2APK_KEY_ALIAS }}
          REPO2APK_KEY_PASSWORD: ${{ secrets.REPO2APK_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          PROJ_DIR="${{ inputs.project_dir }}"
          cd "$PROJ_DIR"
          OUT_DIR="$RUNNER_TEMP/repo2apk-output"
          mkdir -p "$OUT_DIR"

          APK_PATH="$(find . -type f -path '*/outputs/apk/*' -name '*.apk' ! -name '*androidTest*' ! -name '*-unaligned*' | head -n 1 || true)"
          if [[ -z "$APK_PATH" ]]; then
            APK_PATH="$(find . -type f -name '*.apk' ! -path '*/intermediates/*' ! -name '*androidTest*' ! -name '*-unaligned*' | head -n 1 || true)"
          fi
          if [[ -z "$APK_PATH" || ! -f "$APK_PATH" ]]; then
            echo "No valid APK artifact found after compilation." >&2
            exit 1
          fi

          APK_FILE="$(basename "$APK_PATH")"
          TARGET_APK="$OUT_DIR/$APK_FILE"
          cp "$APK_PATH" "$TARGET_APK"

          APKSIGNER="$(find "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools" -name apksigner 2>/dev/null | sort -V | tail -n 1 || true)"
          AAPT2="$(find "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools" -name aapt2 2>/dev/null | sort -V | tail -n 1 || true)"

          SIGNING_STATUS="unsigned"
          IS_SIGNED="false"
          if [[ "${{ inputs.build_mode }}" == "debug" ]]; then
            SIGNING_STATUS="debug_signed"
            IS_SIGNED="true"
          elif [[ "${HAS_KEYSTORE:-false}" == "true" && -n "$APKSIGNER" && -f "$RUNNER_TEMP/repo2apk-signing/release.keystore" ]]; then
            "$APKSIGNER" sign               --ks "$RUNNER_TEMP/repo2apk-signing/release.keystore"               --ks-key-alias "$REPO2APK_KEY_ALIAS"               --ks-pass "pass:$REPO2APK_STORE_PASSWORD"               --key-pass "pass:$REPO2APK_KEY_PASSWORD"               "$TARGET_APK"
            SIGNING_STATUS="signed"
            IS_SIGNED="true"
          elif [[ -n "$APKSIGNER" ]] && "$APKSIGNER" verify "$TARGET_APK" >/dev/null 2>&1; then
            SIGNING_STATUS="signed"
            IS_SIGNED="true"
          fi

          # Validate ZIP & AndroidManifest.xml structure
          unzip -l "$TARGET_APK" | grep -q "AndroidManifest.xml"
          SHA256="$(sha256sum "$TARGET_APK" | awk '{print $1}')"

          PKG_ID=""
          APP_NAME=""
          V_NAME=""
          V_CODE=""
          if [[ -n "$AAPT2" ]]; then
            BADGING="$("$AAPT2" dump badging "$TARGET_APK" 2>/dev/null || true)"
            PKG_ID="$(printf '%s\n' "$BADGING" | sed -n "s/.*package: name='\([^']*\)'.*/\1/p" | head -n 1)"
            V_CODE="$(printf '%s\n' "$BADGING" | sed -n "s/.*versionCode='\([^']*\)'.*/\1/p" | head -n 1)"
            V_NAME="$(printf '%s\n' "$BADGING" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p" | head -n 1)"
            APP_NAME="$(printf '%s\n' "$BADGING" | sed -n "s/.*application-label:'\([^']*\)'.*/\1/p" | head -n 1)"
          fi

          jq -n             --arg fileName "$APK_FILE"             --arg appName "$APP_NAME"             --arg packageId "$PKG_ID"             --arg versionName "$V_NAME"             --arg versionCode "$V_CODE"             --arg sha256 "$SHA256"             --argjson isSigned "$IS_SIGNED"             --arg signingStatus "$SIGNING_STATUS"             --arg abi "${{ inputs.abi_mode }}"             '{fileName: $fileName, appName: $appName, packageId: $packageId, versionName: $versionName, versionCode: $versionCode, sha256: $sha256, isSigned: $isSigned, signingStatus: $signingStatus, abi: $abi}' > "$OUT_DIR/repo2apk-metadata.json"

          echo "Validated APK: $APK_FILE (SHA-256: $SHA256, signing: $SIGNING_STATUS)"

      - name: "[Stage 7] Upload APK artifact"
        uses: actions/upload-artifact@v4
        with:
          name: repo2apk-${{ inputs.build_id }}
          path: ${{ runner.temp }}/repo2apk-output/*
          retention-days: 1
          if-no-files-found: error

      - name: Cleanup ephemeral signing workspace
        if: always()
        shell: bash
        run: rm -rf "$RUNNER_TEMP/repo2apk-signing"
